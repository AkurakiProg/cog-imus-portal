<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Sample QR Code Placeholder - Not an active payment account">
  <rect width="320" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <rect x="16" y="16" width="288" height="288" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Top-left neutral finder illustration (non-scannable) -->
  <rect x="34" y="34" width="64" height="64" rx="10" fill="none" stroke="#0f1e36" stroke-width="8"/>
  <rect x="52" y="52" width="28" height="28" rx="4" fill="#0f1e36" opacity="0.25"/>

  <!-- Top-right neutral finder illustration -->
  <rect x="222" y="34" width="64" height="64" rx="10" fill="none" stroke="#0f1e36" stroke-width="8"/>
  <rect x="240" y="52" width="28" height="28" rx="4" fill="#0f1e36" opacity="0.25"/>

  <!-- Bottom-left neutral finder illustration -->
  <rect x="34" y="222" width="64" height="64" rx="10" fill="none" stroke="#0f1e36" stroke-width="8"/>
  <rect x="52" y="240" width="28" height="28" rx="4" fill="#0f1e36" opacity="0.25"/>

  <!-- Decorative non-scannable grid blocks -->
  <g fill="#94a3b8" opacity="0.32">
    <rect x="122" y="42" width="16" height="16" rx="3"/>
    <rect x="150" y="42" width="16" height="16" rx="3"/>
    <rect x="178" y="42" width="16" height="16" rx="3"/>
    <rect x="122" y="70" width="16" height="16" rx="3"/>
    <rect x="178" y="70" width="16" height="16" rx="3"/>
    <rect x="42" y="122" width="16" height="16" rx="3"/>
    <rect x="70" y="122" width="16" height="16" rx="3"/>
    <rect x="234" y="122" width="16" height="16" rx="3"/>
    <rect x="262" y="122" width="16" height="16" rx="3"/>
    <rect x="42" y="182" width="16" height="16" rx="3"/>
    <rect x="70" y="182" width="16" height="16" rx="3"/>
    <rect x="234" y="182" width="16" height="16" rx="3"/>
    <rect x="262" y="182" width="16" height="16" rx="3"/>
    <rect x="122" y="234" width="16" height="16" rx="3"/>
    <rect x="178" y="234" width="16" height="16" rx="3"/>
    <rect x="150" y="262" width="16" height="16" rx="3"/>
    <rect x="226" y="234" width="24" height="24" rx="5"/>
    <rect x="256" y="256" width="24" height="24" rx="5"/>
  </g>

  <!-- Clear center watermark badge -->
  <rect x="48" y="114" width="224" height="92" rx="12" fill="#0f1e36"/>
  <rect x="52" y="118" width="216" height="84" rx="9" fill="none" stroke="#c9a227" stroke-width="2"/>
  <text x="160" y="149" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1.5" fill="#e8c858">SAMPLE QR</text>
  <text x="160" y="171" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#ffffff">PLACEHOLDER ONLY</text>
  <text x="160" y="189" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#cbd5e1">NOT AN ACTIVE PAYMENT ACCOUNT</text>
</svg>
